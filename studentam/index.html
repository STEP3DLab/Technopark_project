<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Будущий информационный сайт Технопарка и студенческого конструкторского бюро РГСУ.">
  <meta name="robots" content="noindex, nofollow">
  <title>Технопарк РГСУ — страница в разработке</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111827;
      --muted: #5f6b7a;
      --line: rgba(17, 24, 39, 0.10);
      --accent: #2457d6;
      --accent-soft: #eef3ff;
      --surface: rgba(255, 255, 255, 0.88);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      color: var(--ink);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at 16% 18%, rgba(36, 87, 214, 0.18), transparent 32%),
        radial-gradient(circle at 85% 82%, rgba(97, 209, 255, 0.22), transparent 34%),
        linear-gradient(145deg, #f8faff 0%, #edf3ff 52%, #f8fbff 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 999px;
      pointer-events: none;
    }

    body::before {
      width: 320px;
      height: 320px;
      top: -150px;
      right: -90px;
      background: rgba(36, 87, 214, 0.09);
    }

    body::after {
      width: 230px;
      height: 230px;
      left: -90px;
      bottom: -110px;
      background: rgba(97, 209, 255, 0.13);
    }

    main {
      position: relative;
      z-index: 1;
      width: min(760px, 100%);
      padding: clamp(34px, 7vw, 72px);
      border: 1px solid var(--line);
      border-radius: 30px;
      background: var(--surface);
      box-shadow: 0 28px 80px rgba(36, 87, 214, 0.13);
      backdrop-filter: blur(18px);
      text-align: center;
    }

    .label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      padding: 9px 14px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.045em;
      text-transform: uppercase;
    }

    .label::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 5px rgba(36, 87, 214, 0.10);
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 7vw, 72px);
      line-height: 0.98;
      letter-spacing: -0.045em;
      text-wrap: balance;
    }

    p {
      max-width: 590px;
      margin: 28px auto 0;
      color: var(--muted);
      font-size: clamp(17px, 2.4vw, 21px);
      line-height: 1.55;
      text-wrap: balance;
    }

    footer {
      margin-top: 40px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 520px) {
      main { border-radius: 24px; }
      .label { font-size: 11px; }
      h1 { line-height: 1.04; }
    }
  </style>
</head>
<body>
  <main>
    <div class="label">Технопарк РГСУ и студенческое конструкторское бюро</div>
    <h1>Страница находится в разработке</h1>
    <p>Здесь будет размещена информация для студентов РГСУ о лабораториях, проектах и возможностях участия.</p>
    <footer>Проектный центр «Технопарк РГСУ»</footer>
  </main>
</body>
</html>
