name: Publish DUB / OLIVA apartment website
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-dub-oliva.yml'
      - 'dub-oliva-interior-3d/mirror.py'
permissions:
  contents: write
concurrency:
  group: publish-dub-oliva-interior-3d
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Copy public site and all detected local assets
        run: python dub-oliva-interior-3d/mirror.py
      - name: Commit mirrored site to GitHub Pages branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A dub-oliva-interior-3d
          if git diff --cached --quiet; then
            echo 'No content changes'
            exit 0
          fi
          git commit -m 'Publish DUB / OLIVA 3D site with GLB, panoramas and renders'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1
