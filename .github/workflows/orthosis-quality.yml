name: Orthosis site and manufacturing-file QA

on:
  push:
    branches: [main]
    paths:
      - 'orthosis/**'
      - '.github/workflows/orthosis-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orthosis-static-qa
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JavaScript syntax
        run: |
          node --check orthosis/app.js
          node --check orthosis/drive-visual.js
          node --check orthosis/fallback.js
      - name: Validate model metadata and downloadable file integrity
        run: python orthosis/test_site.py
