<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key='engineering-memory-v1';let db={people:[],materials:[],notes:[],draft:''};let storageOk=true;
try{const x=JSON.parse(localStorage.getItem(key)||'null');if(x&&Array.isArray(x.people)&&Array.isArray(x.materials)&&Array.isArray(x.notes))db={...db,...x}}catch(e){storageOk=false}
function save(){try{localStorage.setItem(key,JSON.stringify(db));return true}catch(e){storageOk=false;toast('Не удалось сохранить: хранилище браузера недоступно или заполнено. Экспортируйте данные.');return false}}
function toast(t){$('#toast').textContent=t;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').textContent='',4500)}
const titles={library:'Банк знаний',people:'Носители опыта',archive:'Архив материалов',studio:'Мастерская знаний',ideas:'Новые разработки',case:'Чернобыль и роботы',about:'О проекте'};
let route='library',tab='overview',filter='Все',analysis=null;
const footer=()=>'<footer>СКБ Технопарка РГСУ · Живая инженерная память<br>Прототип: пользовательские записи хранятся только в этом браузере. Демопримеры не являются архивными свидетельствами.</footer>';
const heading=(h,p,b='')=>'<div class="heading"><div><h1>'+h+'</h1><p>'+p+'</p></div>'+b+'</div>';
const btn=(text,act,cls='')=>'<button class="'+cls+'" '+act+'>'+text+'</button>';
function go(r){location.hash=r;if(route===r)render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-route]');if(b)go(b.dataset.route)});
window.addEventListener('hashchange',render);
function render(){route=location.hash.slice(1)||'library';if(!titles[route])route='library';$('#crumb').textContent=titles[route];document.querySelectorAll('.nav button').forEach(b=>{b.classList.toggle('active',b.dataset.route===route);b.setAttribute('aria-current',b.dataset.route===route?'page':'false')});$('#app').innerHTML=({library,people,archive,studio,ideas,case:caseView,about}[route])()+footer();if(route==='studio')bindStudio();if(route==='library')bindSearch();if(route==='archive')bindArchive();window.scrollTo(0,0)}
function library(){return heading('Банк инженерных знаний','Люди, решения и опыт, которые становятся основой новых разработок.',btn('+ Передать знания','onclick="openContribution()"','primary'))+
'<div class="toolbar"><input class="search" id="search" aria-label="Поиск по банку знаний" placeholder="Найти человека, проект или инженерное решение…"></div><div class="toolbar" id="filters">'+['Все','Робототехника','Инженерные решения','Образование'].map(x=>btn(x,'data-filter="'+x+'"','filter '+(filter===x?'selected':''))).join('')+'</div><div id="results">'+libraryResults('')+'</div>'}
function libraryResults(q){q=q.toLowerCase().trim();const local=[...db.people.map(p=>({title:p.name,text:p.field+' '+p.bio,kind:'Специалист',route:'people'})),...db.materials.map(m=>({title:m.title,text:m.text,kind:'Материал',route:'archive'})),...db.notes.map(n=>({title:n.title,text:n.source,kind:'Карточка знания',route:'studio'}))].filter(x=>(x.title+' '+x.text).toLowerCase().includes(q));const localHTML=local.length?'<div class="sectionhead"><h2>Ваши записи</h2><span class="small muted">'+local.length+'</span></div><div class="cards3">'+local.map(x=>'<article class="card"><span class="tag">'+x.kind+'</span><h3>'+esc(x.title)+'</h3><p>'+esc(x.text.slice(0,140))+'</p>'+btn('Открыть раздел','data-route="'+x.route+'"')+'</article>').join('')+'</div>':'';const match=('батанов чернобыль робототехника роботы инженерные решения образование мобот').includes(q);
return localHTML+((!q||match)?'<div class="grid"><article class="feature"><span class="eyebrow">Первый практический кейс</span><span class="serial" aria-hidden="true">01</span><h2>Чернобыль и роботы:<br>сохранить логику решений</h2><p>Материалы и воспоминания Александра Федоровича Батанова о создании робототехнических комплексов для ликвидации последствий аварии.</p><div class="statrow"><div><strong>Человек</strong><span>носитель инженерного опыта</span></div><div><strong>Архив</strong><span>источники и свидетельства</span></div><div><strong>Знание</strong><span>передача следующему поколению</span></div></div><div class="bottom">'+btn('Исследовать кейс ↗','data-route="case"','primary')+'<span class="badge">Пилот · материалы готовятся к загрузке</span></div></article><aside class="card"><span class="eyebrow muted">Как работает система</span><h2 style="margin-top:15px">От рассказа<br>к новому знанию</h2><div class="steps"><div class="step"><div><strong>Собрать опыт</strong><p>Интервью, записи, документы и фотографии.</p></div></div><div class="step"><div><strong>Понять решение</strong><p>Задача, ограничения, альтернативы и результат.</p></div></div><div class="step"><div><strong>Проверить с автором</strong><p>Уточнить факты и сохранить связь с источником.</p></div></div><div class="step"><div><strong>Передать в работу</strong><p>Лекция, ВКР, НИР или новая разработка.</p></div></div></div></aside></div><div class="sectionhead"><h2>'+ (filter==='Образование'?'Знание для образования':filter==='Инженерные решения'?'Разобрать инженерное решение':'Продолжить работу с опытом')+'</h2><span class="small muted">'+(filter==='Образование'||filter==='Инженерные решения'?'2':'3')+' сценария</span></div><div class="cards3"><article class="card" '+(filter==='Образование'?'hidden':'')+'><div class="number">01 /</div><span class="tag">Интервью</span><h3>Что осталось за чертежом?</h3><p>Зафиксируйте причины выбора, неудачные варианты и практические приёмы.</p>'+btn('Открыть мастерскую ↗','data-route="studio"')+'</article><article class="card"><div class="number">02 /</div><span class="tag">Связи знаний</span><h3>Человек → проект → решение</h3><p>Рассмотрите, как свидетельства связываются с инженерными задачами.</p>'+btn('Посмотреть связи ↗','onclick="tab=\'map\';go(\'case\')"')+'</article><article class="card" '+(filter==='Инженерные решения'?'hidden':'')+'><div class="number">03 /</div><span class="tag">Потенциал развития</span><h3>Идеи, которые ждали времени</h3><p>Оцените, что изменили новые материалы, электроника и вычисления.</p>'+btn('Перейти к разработкам ↗','data-route="ideas"')+'</article></div>': local.length?'':'<div class="empty"><h2>Совпадений пока нет</h2><p>Попробуйте «Батанов», «Чернобыль» или «робототехника».</p>'+btn('Сбросить поиск','onclick="$(\'#search\').value=\'\';$(\'#results\').innerHTML=libraryResults(\'\')"')+'</div>');}
function bindSearch(){$('#search').addEventListener('input',e=>$('#results').innerHTML=libraryResults(e.target.value));$('#filters').addEventListener('click',e=>{if(e.target.dataset.filter){filter=e.target.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('selected',b.dataset.filter===filter));$('#results').innerHTML=libraryResults($('#search').value)}})}
function people(){return heading('Носители опыта','Инженерная школа начинается с человека.',btn('+ Добавить специалиста','onclick="openPerson()"','primary'))+'<div class="cards3"><article class="card"><div class="avatar" style="width:60px;height:60px;font-size:18px">АБ</div><h2 style="margin-top:20px">Александр Федорович<br>Батанов</h2><span class="tag">Робототехника</span><span class="badge">Первый кейс</span><p style="margin-top:18px">Работа с материалами и воспоминаниями о робототехнических комплексах для ликвидации последствий аварии на Чернобыльской АЭС.</p>'+btn('Открыть историю ↗','data-route="case"')+'</article>'+db.people.map(p=>'<article class="card"><div class="avatar">СКБ</div><h2 style="margin-top:20px">'+esc(p.name)+'</h2><span class="tag">'+esc(p.field)+'</span><p>'+esc(p.bio)+'</p><span class="badge amber">Локальная запись</span></article>').join('')+'</div>'}
function caseView(){const tabs={overview:'Обзор кейса',map:'Карта связей',sources:'Источники',tasks:'В образование'};return btn('← Банк знаний','data-route="library"','back')+heading('Чернобыль и роботы','Первый кейс · Александр Федорович Батанов',btn('Подготовить интервью','data-route="studio"','primary'))+'<div class="tabs">'+Object.entries(tabs).map(([k,v])=>btn(v,'onclick="tab=\''+k+'\';render()"',tab===k?'active':'')).join('')+'</div>'+({overview:caseOverview,map:caseMap,sources:caseSources,tasks:caseTasks}[tab]||caseOverview)()}
function caseOverview(){return '<div class="grid"><div class="card"><span class="eyebrow muted">Контекст проекта</span><h2 style="margin-top:20px">Зафиксировать не только «что»,<br>но и «почему»</h2><p>Первоначальный практический задел — работа СКБ с материалами и воспоминаниями Александра Федоровича Батанова. Система должна объединить рассказ специалиста, документы и инженерную логику проекта.</p><div class="timeline"><div class="event"><strong>Инженерный опыт</strong><p>Создание робототехнических комплексов для работы при ликвидации последствий аварии на ЧАЭС.</p></div><div class="event"><strong>Сохранение свидетельств</strong><p>Интервью, оцифровка личного архива, фиксация контекста и авторства.</p></div><div class="event"><strong>Передача знаний</strong><p>Систематизация решений и подготовка материалов для образования и исследований.</p></div></div><div class="note">Основание этой карточки — описание проекта, предоставленное инициатором. Подлинные интервью и архивные документы в прототип ещё не загружены.</div></div><aside class="card"><h3>Вопросы следующего интервью</h3>'+['Какая задача определяла конструкцию комплекса?','Какие ограничения оказались решающими?','Какие варианты были отвергнуты и почему?','Какие документы подтверждают последовательность событий?','Что сегодня можно было бы сделать иначе?'].map((t,i)=>'<div class="listitem"><span class="small muted">0'+(i+1)+'</span><p style="color:var(--ink)">'+t+'</p></div>').join('')+'</aside></div>'}
function caseMap(){return '<div class="grid"><section class="card"><h2>Связи внутри кейса</h2><p>Выберите элемент, чтобы увидеть его роль. Это схема структуры пилота, а не автоматически восстановленная история.</p><div class="graph"><button class="node center" onclick="nodeInfo(0)"><small>НОСИТЕЛЬ ОПЫТА</small>А. Ф. Батанов</button><button class="node" onclick="nodeInfo(1)"><small>СВИДЕТЕЛЬСТВА</small>Интервью и архив</button><button class="node" onclick="nodeInfo(2)"><small>ПРОЕКТ</small>Робототехнические комплексы</button><button class="node" onclick="nodeInfo(3)"><small>ИЗВЛЕЧЕНИЕ</small>Инженерные решения</button><button class="node" onclick="nodeInfo(4)"><small>ПРИМЕНЕНИЕ</small>Образование и НИР</button></div><div class="detail note" id="nodeinfo">Связь: носитель опыта → свидетельства → проверенное знание. Для каждого вывода должны сохраняться источник и статус проверки.</div></section><aside class="card"><h3>Правило достоверности</h3><div class="steps"><div class="step"><div><strong>Свидетельство</strong><p>Что сказал автор или что написано в документе.</p></div></div><div class="step"><div><strong>Интерпретация</strong><p>Как исследователь понимает это свидетельство.</p></div></div><div class="step"><div><strong>Подтверждение</strong><p>Что проверено специалистом и другими источниками.</p></div></div></div></aside></div>'}
function nodeInfo(i){$('#nodeinfo').textContent=['Александр Федорович Батанов → передаёт воспоминания и материалы. Роль специалиста — уточнять контекст и проверять интерпретации.','Интервью и архив → являются источниками. Оригиналы пока не загружены; добавьте собственный материал в разделе «Архив».','Робототехнические комплексы → объект первого кейса. Точные технические характеристики необходимо извлекать из подлинных документов.','Инженерное решение → задача, ограничения, альтернативы, выбор, результат. Каждая карточка сохраняет исходный фрагмент.','Образование и НИР → использование проверенных решений в лекциях, ВКР и новых исследованиях.'][i]}
function caseSources(){return '<div class="empty"><span class="eyebrow muted">Подлинные источники</span><h2 style="margin-top:16px">Архив готов к наполнению</h2><p>Добавьте расшифровки интервью, описания фотографий<br>и ссылки на документы, которыми вы вправе пользоваться.</p>'+btn('+ Добавить материал','onclick="openMaterial()"','primary')+'</div>'+materialList(db.materials)}
function caseTasks(){return '<div class="cards3">'+[['Учебная задача','Реконструкция инженерного выбора','Составить матрицу «задача → ограничения → варианты → решение». Для каждого вывода указать фрагмент источника.'],['Тема ВКР','Цифровой архив инженерной школы','Разработать модель данных, версионность свидетельств и процедуру экспертного подтверждения.'],['Исследование','Тогда и сейчас: сравнение технологий','Сопоставить ограничения исторического проекта с современными возможностями. Не подменять исторические факты гипотезами.']].map(x=>'<article class="card"><span class="tag">'+x[0]+'</span><h3>'+x[1]+'</h3><p>'+x[2]+'</p><span class="badge amber">Предложение, не утверждённая тема</span></article>').join('')+'</div>'}
function archive(){return heading('Архив материалов','Источники, контекст и авторство — в одном месте.',btn('+ Добавить материал','onclick="openMaterial()"','primary'))+'<div class="toolbar"><input id="archiveSearch" class="search" aria-label="Поиск материалов" placeholder="Поиск по названию и содержанию"><select id="archiveType" aria-label="Тип материала" style="width:auto"><option>Все типы</option><option>Интервью</option><option>Документ</option><option>Фотография</option><option>Рабочая запись</option></select>'+btn('Экспорт данных','onclick="exportData()"')+'</div><div id="materialResults">'+materialList(db.materials)+'</div><div class="note">В прототипе сохраняются текст, описание и ссылка. Оригиналы PDF, фото, аудио и видео на сервер не загружаются. TXT-файл можно импортировать в текст материала.</div>'}
function materialList(a){return a.length?'<div class="card">'+a.map(m=>'<article class="listitem"><div class="row spread"><span class="tag">'+esc(m.type)+'</span><span class="small muted">'+esc(m.date)+'</span></div><h3>'+esc(m.title)+'</h3><p>'+esc(m.text.slice(0,180))+(m.text.length>180?'…':'')+'</p><div class="row spread"><span class="small muted">'+esc(m.author)+'</span>'+btn('Открыть','onclick="showMaterial(\''+m.id+'\')"')+'</div></article>').join('')+'</div>':'<div class="empty"><h2>Первое свидетельство — начало архива</h2><p>Добавьте запись интервью или описание документа.</p>'+btn('Добавить материал','onclick="openMaterial()"','primary')+'</div>'}
function bindArchive(){const f=()=>$('#materialResults').innerHTML=materialList(db.materials.filter(m=>(m.title+' '+m.text).toLowerCase().includes($('#archiveSearch').value.toLowerCase())&&($('#archiveType').value==='Все типы'||m.type===$('#archiveType').value)));$('#archiveSearch').oninput=f;$('#archiveType').onchange=f}
function showMaterial(id){const m=db.materials.find(x=>x.id===id);if(!m)return;modal('<span class="tag">'+esc(m.type)+'</span><h2>'+esc(m.title)+'</h2><p>Автор / источник: '+esc(m.author)+'</p><div class="output">'+esc(m.text)+'</div>'+(safeUrl(m.url)?'<p style="margin-top:15px"><a target="_blank" rel="noopener noreferrer" href="'+esc(m.url)+'">Открыть внешний источник ↗</a></p>':'')+btn('Разобрать в мастерской','onclick="useMaterial(\''+id+'\')"','primary'))}
function useMaterial(id){const m=db.materials.find(x=>x.id===id);db.draft=m.text;save();analysis=null;$('#modal').close();go('studio')}
const demo='Учебный пример, не цитата А. Ф. Батанова.\nЗадача: осмотреть участок, недоступный оператору.\nОграничение: неустойчивая радиосвязь и ограниченное время работы.\nВарианты: радиоканал; проводное управление.\nРешение: испытать проводное управление на стенде.\nРезультат: связь на стенде стабильна, но кабель ограничивает перемещение.\nВопрос: какой способ прокладки кабеля уменьшит риск зацепления?';
function studio(){return heading('Мастерская знаний','Превратите рассказ специалиста в проверяемую карточку решения.')+'<div class="note">Демонстрация будущего ИИ-помощника. Сейчас работает локальный разбор по меткам «Задача», «Ограничение», «Варианты», «Решение», «Результат». Языковая модель не подключена.</div><div class="grid"><section class="card"><div class="row spread"><h2>01. Исходный рассказ</h2><span class="badge">Текст интервью</span></div><label for="transcript">Вставьте фрагмент или начните с примера</label><textarea id="transcript" maxlength="100000" placeholder="Что нужно было сделать? Что мешало? Почему выбрали это решение?">'+esc(db.draft)+'</textarea><div class="toolbar">'+btn('Разобрать фрагмент','id="analyze"','primary')+btn('Учебный пример','id="loadDemo"')+'</div><div class="small muted" id="saveState">Черновик сохраняется в этом браузере.</div><h3 style="margin-top:27px">Вопросы, которые помогают раскрыть опыт</h3><p>Что не получилось с первого раза? Что было известно только вашей команде? Какие идеи пришлось отложить?</p></section><section class="card"><div class="row spread"><h2>02. Карточка знания</h2><span class="badge amber">Нужна проверка</span></div><div id="analysis">'+(analysis?analysisHTML():'<div class="empty"><h3>Здесь появится структура решения</h3><p>Выделенные фрагменты сохранят связь с исходным текстом. Пропуски станут вопросами к специалисту.</p></div>')+'</div></section></div><div class="sectionhead"><h2>Сохранённые карточки</h2><span class="small muted">'+db.notes.length+'</span></div>'+ (db.notes.length?'<div class="cards3">'+db.notes.map(n=>'<article class="card"><span class="badge amber">Черновик · не подтверждён</span><h3>'+esc(n.title)+'</h3><p>'+esc(n.parts['Решение']||'Решение не указано')+'</p>'+btn('Открыть','onclick="openNote(\''+n.id+'\')"')+'</article>').join('')+'</div>':'<p>Пока нет карточек. Разберите фрагмент и сохраните результат.</p>')}
function bindStudio(){$('#transcript').oninput=e=>{db.draft=e.target.value;$('#saveState').textContent=save()?'Черновик сохранён в этом браузере.':'Черновик не сохранён';if(analysis){analysis=null;$('#analysis').innerHTML='<p>Текст изменён. Выполните разбор заново.</p>'}};$('#loadDemo').onclick=()=>{db.draft=demo;save();analysis=null;render()};$('#analyze').onclick=()=>{const text=$('#transcript').value.trim();if(text.length<20){toast('Добавьте хотя бы 20 символов текста.');return}const parts={};for(const label of ['Задача','Ограничение','Варианты','Решение','Результат']){const line=text.split('\n').find(x=>x.toLowerCase().startsWith(label.toLowerCase()+':'));parts[label]=line?line.slice(line.indexOf(':')+1).trim():''}analysis={id:crypto.randomUUID(),title:parts['Задача']||'Разбор фрагмента интервью',source:text,parts};$('#analysis').innerHTML=analysisHTML()}}
function analysisHTML(){return Object.entries(analysis.parts).map(([k,v])=>'<div class="result"><strong>'+k+'</strong><p>'+esc(v||'Не выделено. Уточните у специалиста и добавьте в исходный текст.')+'</p></div>').join('')+'<p class="small muted">Это извлечение помеченных строк, а не проверка достоверности. Противоречия автоматически не выявляются.</p><div class="toolbar">'+btn('Сохранить карточку','onclick="saveNote()"','primary')+btn('Экспорт в Markdown','onclick="exportNote()"')+'</div>'}
function saveNote(){if(!analysis)return;if(db.notes.some(n=>n.id===analysis.id)){toast('Карточка уже сохранена');return}db.notes.push(JSON.parse(JSON.stringify(analysis)));save();toast('Карточка сохранена как неподтверждённый черновик');render()}
function noteText(n){return '# '+n.title+'\n\nСтатус: черновик, требует проверки носителем опыта.\n\n'+Object.entries(n.parts).map(([k,v])=>'## '+k+'\n'+(v||'Требует уточнения')).join('\n\n')+'\n\n## Исходный фрагмент\n'+n.source+'\n\n## Дальнейшая работа\n- Проверить факты с автором.\n- Добавить ссылки на первоисточники.\n- Сформулировать учебную задачу и критерии проверки.'}
function exportNote(){if(analysis)download('engineering-knowledge.md',noteText(analysis),'text/markdown')}
function openNote(id){const n=db.notes.find(n=>n.id===id);if(!n)return;modal('<h2>Карточка знания</h2><div class="output">'+esc(noteText(n))+'</div>'+btn('Скачать Markdown','onclick="downloadNote(\''+id+'\')"','primary'))}
function downloadNote(id){const n=db.notes.find(n=>n.id===id);if(n)download('engineering-knowledge.md',noteText(n),'text/markdown')}
function ideas(){return heading('Идеи, которые ждали времени','Вернуться к незавершённому — с современной технологической базой.')+'<div class="grid"><article class="card"><span class="badge amber">Учебная гипотеза · не исторический факт</span><h2 style="margin-top:24px">Переосмыслить управление<br>мобильным роботом</h2><p>Пример того, как из анализа ограничений рождается тема исследования. Связь с реальными незавершёнными разработками Батанова не установлена.</p><div class="listitem"><strong>Какое ограничение изучить?</strong><p>Устойчивость управления при потере связи и ограниченной видимости.</p></div><div class="listitem"><strong>Что можно проверить сегодня?</strong><p>Сравнить проводное управление, радиоканал и безопасную остановку при обрыве связи на учебном стенде.</p></div><div class="listitem"><strong>Первый результат</strong><p>Матрица условий, протокол испытаний и критерии устойчивости — до проектирования нового изделия.</p></div>'+btn('Сформировать план исследования','onclick="researchPlan()"','primary')+'</article><aside class="card"><h2>Фильтр перспективности</h2><div class="steps">'+[['Источник','Есть описание первоначального замысла?'],['Причина остановки','Известно, чего не хватало для реализации?'],['Технологический сдвиг','Появился способ преодолеть ограничение?'],['Проверка','Можно поставить небольшой воспроизводимый эксперимент?']].map(x=>'<div class="step"><div><strong>'+x[0]+'</strong><p>'+x[1]+'</p></div></div>').join('')+'</div></aside></div>'}
function researchPlan(){const s='# План учебного исследования\n\nТема: устойчивость управления мобильным роботом.\nСтатус: учебная гипотеза, не исторический факт.\n\n1. Найти подлинные источники и подтвердить исходное ограничение.\n2. Составить требования и критерии безопасной остановки.\n3. Собрать маломощный учебный стенд.\n4. Сравнить управление по кабелю и радиоканалу при контролируемых помехах.\n5. Зафиксировать задержку, потери команд и поведение при потере связи.\n6. Обсудить результаты с носителем опыта.\n7. Оформить протокол, ограничения эксперимента и дальнейшие вопросы.';modal('<h2>План исследования</h2><div class="output">'+esc(s)+'</div>'+btn('Скачать план','id="downloadPlan"','primary'));$('#downloadPlan').onclick=()=>download('research-plan.md',s,'text/markdown')}
function about(){return heading('Сохранить школу. Передать мышление.','Инициатива Студенческого конструкторского бюро Технопарка РГСУ.')+'<div class="grid"><section class="card"><h2>Живая инженерная память</h2><p>Значительная часть опыта существует в знаниях конкретных людей: почему принято решение, какие варианты не сработали, какие идеи остались незавершёнными.</p><p>Проект объединяет интервью, оцифровку личных архивов, систематизацию знаний и их применение в образовании и исследованиях.</p><p class="quote">Сохранить не только изделие,<br>но и способ думать, благодаря которому оно появилось.</p><h3>Что работает в этом прототипе</h3><p>Навигация по кейсу, карта связей, создание записей специалистов и материалов, поиск по архиву, локальный разбор текста, сохранение карточек и экспорт.</p><h3>Что предстоит подключить</h3><p>Общее хранилище, учётные записи, загрузку оригиналов, распознавание речи и документов, языковую модель с цитированием источников и экспертное подтверждение версий.</p></section><aside class="card"><h3>Ваши локальные данные</h3><div class="stat">'+(db.materials.length+db.notes.length+db.people.length)+'</div><p>записей в этом браузере</p><div class="toolbar">'+btn('Экспорт JSON','onclick="exportData()"','primary')+'</div><label for="restore">Восстановить из экспорта</label><input type="file" id="restore" accept=".json,application/json" onchange="restoreData(this)"><p class="small">Импорт добавляет записи по новым идентификаторам. Существующие записи сохраняются.</p></aside></div>'}
function modal(html){$('#modalbody').innerHTML=html;$('#modal').showModal()}
function openContribution(){modal('<h2>Передать инженерный опыт</h2><p>Выберите удобный первый шаг. Если специалисту нужна помощь, запись может внести сотрудник или студент СКБ.</p><div class="steps"><div class="step"><div><h3>Знаете носителя опыта?</h3>'+btn('Добавить специалиста','onclick="openPerson()"')+'</div></div><div class="step"><div><h3>Есть рассказ или документ?</h3>'+btn('Добавить материал','onclick="openMaterial()"')+'</div></div><div class="step"><div><h3>Готовите интервью?</h3>'+btn('Открыть мастерскую','onclick="$(\'#modal\').close();go(\'studio\')"')+'</div></div></div>')}
function openPerson(){modal('<h2>Носитель инженерного опыта</h2><form id="personform"><div class="field"><label for="pname">Фамилия, имя, отчество</label><input id="pname" name="name" required maxlength="160"></div><div class="field"><label for="pfield">Направление / инженерная школа</label><input id="pfield" name="field" required maxlength="160" placeholder="Например, специальная робототехника"></div><div class="field"><label for="pbio">Какой опыт важно сохранить?</label><textarea id="pbio" name="bio" required maxlength="3000" style="min-height:110px"></textarea></div><p class="small">Запись останется только в вашем браузере.</p><button class="primary">Сохранить специалиста</button></form>');$('#personform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(!f.get('name').trim()||!f.get('field').trim()||!f.get('bio').trim())return;db.people.push({id:crypto.randomUUID(),name:f.get('name').trim(),field:f.get('field').trim(),bio:f.get('bio').trim()});save();$('#modal').close();go('people');toast('Специалист добавлен')}}
function safeUrl(u){try{return ['http:','https:'].includes(new URL(u).protocol)}catch(e){return false}}
function openMaterial(){modal('<h2>Добавить материал</h2><form id="materialform"><div class="field"><label for="mtitle">Название</label><input id="mtitle" name="title" required maxlength="200"></div><div class="formgrid"><div class="field"><label for="mtype">Тип</label><select name="type" id="mtype"><option>Интервью</option><option>Документ</option><option>Фотография</option><option>Рабочая запись</option></select></div><div class="field"><label for="mauthor">Автор / источник</label><input id="mauthor" name="author" required maxlength="200"></div></div><div class="field"><label for="mtext">Текст или описание</label><textarea id="mtext" name="text" required maxlength="100000" style="min-height:120px"></textarea><label class="small" for="txtfile">Или импортируйте TXT (до 100 КБ)</label><input type="file" id="txtfile" accept=".txt,text/plain"></div><div class="field"><label for="murl">Ссылка на оригинал (необязательно)</label><input id="murl" name="url" type="url" placeholder="https://"></div><label class="checklabel"><input type="checkbox" required>Я вправе использовать этот материал.</label><p class="small">Сохраняются текст и ссылка, а не исходный файл.</p><button class="primary">Сохранить материал</button></form>');$('#txtfile').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>100000){toast('Размер TXT должен быть не больше 100 КБ');return}$('#mtext').value=await f.text()};$('#materialform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const x=Object.fromEntries(f);if(!x.title.trim()||!x.author.trim()||!x.text.trim()){toast('Заполните название, автора и текст');return}if(x.url&&!safeUrl(x.url)){toast('Нужна ссылка HTTP или HTTPS');return}db.materials.unshift({...x,id:crypto.randomUUID(),date:new Date().toLocaleDateString('ru-RU')});save();$('#modal').close();go('archive');toast('Материал сохранён в этом браузере')}}
function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportData(){download('engineering-memory-backup.json',JSON.stringify({version:1,...db},null,2),'application/json')}
async function restoreData(input){const f=input.files[0];if(!f)return;try{if(f.size>5000000)throw Error();const x=JSON.parse(await f.text());for(const k of ['people','materials','notes'])if(!Array.isArray(x[k]))throw Error();const fields={people:['id','name','field','bio'],materials:['id','title','type','text','author','date','url'],notes:['id','title','source']};for(const k of Object.keys(fields))for(const item of x[k]){if(!item||fields[k].some(p=>typeof item[p]!=='string'))throw Error();if(k==='notes'&&(!item.parts||['Задача','Ограничение','Варианты','Решение','Результат'].some(p=>typeof item.parts[p]!=='string')))throw Error();if(!/^[a-zA-Z0-9-]+$/.test(item.id))throw Error()}for(const k of Object.keys(fields)){const ids=new Set(db[k].map(v=>v.id));for(const item of x[k])if(!ids.has(item.id)){db[k].push(item);ids.add(item.id)}}save();render();toast('Данные восстановлены')}catch(e){toast('Не удалось прочитать экспорт. Проверьте формат и размер файла.')}}
render();
</script></body></html>
