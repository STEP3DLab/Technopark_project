name: Build wrist cable orthosis V01
on:
  push:
    branches: [main]
    paths:
      - 'wrist-orthosis/source.tar.xz'
      - '.github/workflows/build-wrist-orthosis.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wrist-orthosis-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install CAD and mesh libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad
          python -m pip install numpy trimesh shapely scipy
      - name: Extract verified original source
        run: |
          cd wrist-orthosis
          echo 'ae408e1ba167c088bb7bb812ac360b4ca54578841a71e6bf1974281f59b6b1f9  source.tar.xz' | sha256sum -c -
          tar -xJf source.tar.xz model.scad build.py README.md
      - name: Build original geometry and verify all meshes
        run: python wrist-orthosis/build.py
      - name: Commit verified STL GLB and original sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wrist-orthosis/model.scad wrist-orthosis/build.py wrist-orthosis/README.md wrist-orthosis/files
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(wrist-orthosis): export verified V01 STL GLB and source'
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            sleep 10
            git fetch origin main
            git rebase origin/main || exit 1
          done
          exit 1
