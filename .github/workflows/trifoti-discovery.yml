name: TRIFOTI procurement discovery
on:
  schedule:
    - cron: '17 5,11,17 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trifoti-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover public leads
        run: python trifoti-crm/collector.py
      - name: Commit candidate feed only if changed
        run: |
          git config user.name "trifoti-discovery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trifoti-crm/discovery.json
          if ! git diff --cached --quiet; then
            git commit -m "Update TRIFOTI unverified discovery feed"
            git push
          fi
