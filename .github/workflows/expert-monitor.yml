name: Expert monitor — public source checks

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'expert-monitor/scripts/**'
      - 'expert-monitor/data/source-config.json'
      - 'expert-monitor/data/registry.json'
      - '.github/workflows/expert-monitor.yml'

permissions:
  contents: write

concurrency:
  group: expert-monitor-data
  cancel-in-progress: false

jobs:
  check-public-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate reviewed data
        run: python expert-monitor/scripts/validate.py --data-dir expert-monitor/data
      - name: Check public sources without bypassing restrictions
        run: python expert-monitor/scripts/monitor.py --data-dir expert-monitor/data
      - name: Build portable research database
        run: python expert-monitor/scripts/database.py --data-dir expert-monitor/data
      - name: Save monitor snapshot
        run: |
          git config user.name 'expert-monitor[bot]'
          git config user.email 'expert-monitor[bot]@users.noreply.github.com'
          git add expert-monitor/data/monitoring.json expert-monitor/data/registry.sqlite expert-monitor/data/courts.csv expert-monitor/data/opportunities.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(expert-monitor): refresh public-source checks'
          # A concurrent upstream change rejects this push. Do not rebase a
          # derived database onto a newer registry or force-push another task.
          git push origin HEAD:main
