<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>BREACH — проверка экранов</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#161c22;color:#d9e8e7;font:13px system-ui,sans-serif}header{display:flex;gap:10px;align-items:center;justify-content:center;padding:14px;position:sticky;top:0;z-index:2;background:#161c22e8;flex-wrap:wrap}button,a{font:inherit;padding:9px 14px;background:#27343d;border:1px solid #4d696d;color:#bff6e7;border-radius:5px;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#b5f5dd;color:#082923}main{display:flex;justify-content:center;padding:15px 16px 35px;overflow:auto}iframe{border:1px solid #4e626a;box-shadow:0 18px 75px #0007;flex:none;width:390px;height:844px;border-radius:10px;background:#06090d}span{color:#94aaa9;margin-right:15px}
</style>
<header><span>BREACH / ЭКРАНЫ</span><button data-size="390,844" aria-pressed="true">390 × 844</button><button data-size="360,740" aria-pressed="false">360 × 740</button><button data-size="844,390" aria-pressed="false">844 × 390</button><a href="./">Открыть игру ↗</a></header>
<main><iframe id="game" title="BREACH — экран телефона" src="./?v=2.1" allow="camera; accelerometer; gyroscope; xr-spatial-tracking; fullscreen" allowfullscreen></iframe></main>
<script>document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{const [w,h]=button.dataset.size.split(',');const frame=document.getElementById('game');frame.style.width=w+'px';frame.style.height=h+'px';document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));}));</script>
</html>
