name: Build ORTHOSIS V02 Bowden CAD and kinematics
on:
  push:
    branches: [main]
    paths:
      - 'orthosis/drive_v02/*.py'
      - 'orthosis/drive_v02/parameters.json'
      - '.github/workflows/build-orthosis-v02.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-orthosis-v02
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install geometry tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install cadquery==2.7.0 trimesh==4.11.1 numpy
      - name: Build V02 actual CAD shapes and motion tables
        run: python orthosis/drive_v02/build_drive.py
      - name: Verify STL mesh topology and sampled STEP clearances
        run: python orthosis/drive_v02/verify_drive.py
      - name: Package independent source, CAD and print files
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,json
          base=Path('orthosis/drive_v02');dst=base/'files'
          with zipfile.ZipFile(dst/'Orthosis_V02_Bowden_CAD.zip','w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for f in sorted(dst.rglob('*')):
                  if f.is_file() and f.name!='Orthosis_V02_Bowden_CAD.zip':
                      z.write(f,'Orthosis_V02_Bowden/files/'+str(f.relative_to(dst)))
              for f in sorted(base.glob('*')):
                  if f.is_file() and f.suffix in ('.py','.md','.json'):
                      z.write(f,'Orthosis_V02_Bowden/'+f.name)
          manifest=json.loads((dst/'manifest.json').read_text())
          manifest['archive_sha256']=hashlib.sha256((dst/'Orthosis_V02_Bowden_CAD.zip').read_bytes()).hexdigest()
          (dst/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          print('V02 packaged:',(dst/'Orthosis_V02_Bowden_CAD.zip').stat().st_size)
          PY
      - name: Save authentic V02 geometry to GitHub Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orthosis/drive_v02/files
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(orthosis-v02): verified STEP STL GLB and cable motion outputs'
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            sleep 10
            git fetch origin main
            git rebase origin/main || exit 1
          done
          exit 1
